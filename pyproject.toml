# ==============================================
# codespell 配置 - 拼写检查
# ==============================================
[tool.codespell]
ignore-multiline-regex = "codespell:ignore-begin.*codespell:ignore-end"
ignore-words-list = "deriver"
skip = [
  "*.po",
  "./coverage/*",
  "./dev/*",
  "./docs/dev/_build/*",
  "./docs/blog-site/*",
  "./docs/dev-site/*",
  "./docs/user-site/*",
  "./htmlcov/*",
  "./node_modules/**",
  "./package-lock.json",
  "./warehouse/admin/static/dist/*",
  "./warehouse/static/dist/*",
]

# ==============================================
# coverage 配置 - 代码覆盖率
# ==============================================
[tool.coverage.run]
branch = true
dynamic_context = "test_function"
source = ["warehouse", "tests"]
omit = [
  "warehouse/migrations/*",    # 迁移文件无需测试
  "warehouse/__main__.py",     # 微小的 shim 代码
  "warehouse/wsgi.py",         # 微小的 shim 代码
  "warehouse/celery.py",       # 微小的 shim 代码
]
parallel = true  # 支持多进程并行运行

[tool.coverage.report]
exclude_also = [
  "class \\w+\\(Interface\\):",
  "if (typing\\.)?TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "pytest.fail\\(",
  "case _:\\n\\s*pytest\\.fail\\(",
]

# ==============================================
# djlint 配置 - HTML 模板检查
# ==============================================
[tool.djlint]
# https://www.djlint.com/docs/configuration/
indent = 2
profile = "jinja"
use_gitignore = true
extend_exclude = "warehouse/templates/api/simple/*"  # Simple API 模板有特殊结构
ignore = "H006,T002,T003,T028"

# ==============================================
# mypy 配置 - 静态类型检查
# ==============================================
[tool.mypy]
python_version = "3.14"
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
plugins = ["mypy_zope:plugin"]
exclude = ["warehouse/locale/.*", "warehouse/migrations/versions.*"]
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
# 这些模块尚未有类型定义
module = [
  "bpython.*",
  "b2sdk.*",
  "celery.app.backends.*",
  "celery.backends.redis.*",
  "cgi.*",
  "google.cloud.storage.*",
  "forcediphttpsadapter.*",
  "IPython.*",
  "packaging_legacy.*",
  "paginate.*",
  "paginate_sqlalchemy.*",
  "premailer.*",
  "pymacaroons.*",
  "pyramid.*",
  "pyramid_jinja2.*",
  "pyramid_mailer.*",
  "pyramid_retry.*",
  "pyramid_rpc.*",
  "pyqrcode.*",
  "requests_aws4auth.*",
  "rfc3986.*",
  "transaction.*",
  "venusian.*",
  "whitenoise.*",
  "zope.sqlalchemy.*",
]
ignore_missing_imports = true

# ==============================================
# pip-tools 配置 - 依赖管理
# ==============================================
[tool.pip-tools.compile]
allow-unsafe = true

# ==============================================
# pytest 配置 - 测试框架
# ==============================================
[tool.pytest]
addopts = [
  "--allow-hosts=localhost,::1,stripe,redis",
  "--disable-socket",
  "--durations=20",
  "--numprocesses=auto",
  "-p no:ddtrace",
  "-p no:ddtrace.pytest_bdd",
  "-p no:ddtrace.pytest_benchmark",
]
cache_dir = ".cache/pytest"
filterwarnings = [
  "error",
  "ignore::warehouse.utils.exceptions.DevelopmentModeWarning",
  "ignore:Accessing argon2.__version__ is deprecated.*:DeprecationWarning:passlib.handlers.argon2",
  '''ignore:Deprecated call to `pkg_resources.declare_namespace\('(paste|repoze)'\).*:DeprecationWarning:pkg_resources''',
  "ignore:The behavior of .*best_match.*:DeprecationWarning:webob.*",
  'ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:webob.*',
  "ignore:pkg_resources is deprecated as an API.*:UserWarning:pyramid.asset",
]
markers = [
  "functional: Slower running tests which test the entire system is functioning.",
  "unit: Quick running unit tests which test small units of functionality.",
]
strict = true
testpaths = ["tests/"]

