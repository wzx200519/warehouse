name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --hook-stage pre-commit

  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run lint
        run: make lint
      - name: Run Python unit tests
        run: docker compose run --rm --env COVERAGE=no tests bin/tests --postgresql-host db -m unit
      - name: Run frontend tests
        run: make static_tests

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install zizmor
        run: python -m pip install --upgrade pip zizmor
      - name: Run zizmor
        run: zizmor --format sarif . > zizmor.sarif
      - name: Upload zizmor results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Run Trivy repository scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  docker-verify:
    name: Docker build verification
    needs:
      - pre-commit
      - quality
      - security
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=warehouse-release
          cache-to: type=gha,mode=max,scope=warehouse-release

  publish-image:
    name: Publish Docker image
    needs:
      - pre-commit
      - quality
      - security
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image_repository: ${{ steps.meta.outputs.image_repository }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_REPOSITORY="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHORT_SHA="${GITHUB_SHA::12}"
          {
            echo "image_repository=${IMAGE_REPOSITORY}"
            echo "image_ref=${IMAGE_REPOSITORY}:sha-${SHORT_SHA}"
            echo 'tags<<EOF'
            echo "${IMAGE_REPOSITORY}:sha-${SHORT_SHA}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${IMAGE_REPOSITORY}:main"
              echo "${IMAGE_REPOSITORY}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=warehouse-release
          cache-to: type=gha,mode=max,scope=warehouse-release

  scan-image:
    name: Scan release image
    needs:
      - publish-image
    if: needs.publish-image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.publish-image.outputs.image_repository }}@${{ needs.publish-image.outputs.digest }}
          format: sarif
          output: trivy-image-results.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload Trivy image results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  deploy:
    name: Trigger deployment
    needs:
      - publish-image
      - scan-image
    if: |
      needs.publish-image.result == 'success' &&
      needs.scan-image.result == 'success' &&
      vars.DEPLOY_REPOSITORY != '' &&
      secrets.DEPLOY_REPOSITORY_TOKEN != ''
    runs-on: ubuntu-24.04
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
    steps:
      - name: Dispatch deploy event
        uses: actions/github-script@v7
        env:
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
          DEPLOY_EVENT_TYPE: ${{ vars.DEPLOY_EVENT_TYPE || 'warehouse-deploy' }}
          DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
          IMAGE_REF: ${{ needs.publish-image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        with:
          github-token: ${{ secrets.DEPLOY_REPOSITORY_TOKEN }}
          script: |
            const [owner, repo] = process.env.DEPLOY_REPOSITORY.split('/');
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: process.env.DEPLOY_EVENT_TYPE,
              client_payload: {
                environment: process.env.DEPLOY_ENVIRONMENT,
                image: process.env.IMAGE_REF,
                digest: process.env.IMAGE_DIGEST,
                source_repository: context.repo.owner + '/' + context.repo.repo,
                source_sha: context.sha,
              },
            });
